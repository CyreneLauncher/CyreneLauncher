name: Build Cyrene Launcher
on:
  workflow_dispatch:
    inputs:
      version:
        description: PS4 application version (XX.YY)
        default: '01.06'
        required: true
        type: string
      draft_release:
        description: Create a draft GitHub release after verification
        default: false
        type: boolean
permissions:
  contents: read
concurrency:
  group: cyrene-hosted-release
  cancel-in-progress: false
jobs:
  checks:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          path: orbis-launcher
          persist-credentials: false
      - name: Require application registration
        env:
          ORBIS_MSA_CLIENT_ID: ${{ secrets.ORBIS_MSA_CLIENT_ID }}
        run: test -n "$ORBIS_MSA_CLIENT_ID"
      - name: Test orchestration
        run: python3 -m unittest discover -s orbis-launcher/tools/tests -v
      - name: Require pinned runtime release
        run: orbis-launcher/orbis pin-jdks --check
  assets:
    needs: checks
    runs-on: ubuntu-24.04
    timeout-minutes: 350
    env:
      ORBIS_MSA_CLIENT_ID: ${{ secrets.ORBIS_MSA_CLIENT_ID }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          path: orbis-launcher
          persist-credentials: false
      - uses: ./orbis-launcher/.github/actions/build-host
        with:
          jdks: '17 25'
      - name: Build native drivers, launcher and desktop support
        run: orbis-launcher/orbis assets --jobs 4
      - name: Archive audited assets
        run: |
          python3 orbis-launcher/tools/build_artifacts.py pack --root "$GITHUB_WORKSPACE" \
            --archive orbis-launcher/dist/assets.tar.gz \
            orbis-launcher/graphics-probe/build/graphics-bundle-native \
            orbis-launcher/graphics-probe/build/platform-native \
            orbis-launcher/orbis-java-app/build-cacio/export
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: cyrene-assets
          path: orbis-launcher/dist/assets.tar.gz*
          if-no-files-found: error
          retention-days: 14
      - name: Save logs
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: cyrene-assets-logs
          path: |
            orbis-launcher/build-logs/
            orbis-launcher/graphics-probe/build/**/*.log
          retention-days: 14
  package:
    needs: assets
    runs-on: ubuntu-24.04
    timeout-minutes: 90
    permissions:
      contents: write
    env:
      ORBIS_MSA_CLIENT_ID: ${{ secrets.ORBIS_MSA_CLIENT_ID }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          path: orbis-launcher
          persist-credentials: false
      - uses: ./orbis-launcher/.github/actions/build-host
        with:
          jdks: '17 25'
      - name: Download pinned runtimes from orbis-openjdk
        env:
          # The default token cannot read another private repository; set this secret to a
          # token with read access to CyreneLauncher/orbis-openjdk releases while it is private.
          GH_TOKEN: ${{ secrets.CYRENE_RELEASES_TOKEN || github.token }}
        shell: bash
        run: |
          read -r repository tag < <(python3 -c "import json;l=json.load(open('orbis-launcher/tools/runtimes.lock.json'));print(l['repository'],l['tag'])")
          gh release download "$tag" --repo "$repository" --pattern 'orbis-jdk*-x86_64.tar.xz' --dir incoming/jdks
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          name: cyrene-assets
          path: incoming/assets
      - name: Verify and import components
        shell: bash
        run: |
          orbis-launcher/orbis fetch-jdks --from "$GITHUB_WORKSPACE/incoming/jdks"
          python3 orbis-launcher/tools/build_artifacts.py unpack --root "$GITHUB_WORKSPACE" \
            --archive incoming/assets/assets.tar.gz
          orbis-launcher/orbis seal
      - name: Assemble and validate PKG
        env:
          APP_VERSION: ${{ inputs.version }}
        run: orbis-launcher/orbis package --version "$APP_VERSION"
      - name: Export reusable components and checksum release files
        shell: bash
        run: |
          orbis-launcher/orbis export
          cp orbis-launcher/tools/toolchain.lock.json orbis-launcher/dist/toolchain.lock.json
          cd orbis-launcher/dist
          sha256sum ./*.pkg ./*.json ./*.tar.gz ./*.sha256 > SHA256SUMS
      - name: Save release outputs
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: cyrene-release-${{ inputs.version }}
          path: orbis-launcher/dist/
          if-no-files-found: error
          retention-days: 14
      - name: Save logs
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: cyrene-package-logs
          path: orbis-launcher/build-logs/
          retention-days: 14
      - name: Create draft release
        if: inputs.draft_release
        env:
          GH_TOKEN: ${{ github.token }}
          APP_VERSION: ${{ inputs.version }}
        shell: bash
        run: |
          gh release create "v${APP_VERSION}" orbis-launcher/dist/* \
            --repo "$GITHUB_REPOSITORY" --target "$GITHUB_SHA" --draft \
            --title "Cyrene Launcher ${APP_VERSION}" \
            --notes "Built on GitHub-hosted Ubuntu from pinned sources and SDKs. Includes the verified PKG, reusable components, checksums and runtime manifest. Console testing status must be recorded before publishing this draft."
